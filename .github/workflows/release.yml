name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: cli-assistant-x86_64-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: cli-assistant-aarch64-linux-gnu.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure linker for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p package/cli-assistant/bin
          mkdir -p package/cli-assistant/config
          mkdir -p package/cli-assistant/scripts

          # Binaries
          cp target/${{ matrix.target }}/release/c      package/cli-assistant/bin/
          cp target/${{ matrix.target }}/release/clad    package/cli-assistant/bin/

          # Config template
          cp config/config.toml           package/cli-assistant/config/
          cp config/com.cli-assistant.conf package/cli-assistant/config/
          cp config/clad.service          package/cli-assistant/config/
          cp config/com.redhat.lightspeed.chat.service \
              package/cli-assistant/config/
          cp config/com.redhat.lightspeed.history.service \
              package/cli-assistant/config/
          cp config/com.redhat.lightspeed.user.service \
              package/cli-assistant/config/

          # Install scripts
          cp scripts/install.sh           package/cli-assistant/
          cp scripts/uninstall.sh         package/cli-assistant/

          # Release assets
          cp -a data/release              package/cli-assistant/
          cp -a packaging                 package/cli-assistant/

          # License & docs
          cp LICENSE README.md            package/cli-assistant/

          cd package
          tar czf ../${{ matrix.archive }} cli-assistant/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM build dependencies
        run: |
          dnf install -y \
            bzip2 \
            cargo \
            gcc \
            git \
            rpm-build \
            rust \
            selinux-policy-devel \
            systemd

      - name: Build RPM
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          mkdir -p "${GITHUB_WORKSPACE}/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          git archive \
            --format=tar.gz \
            --prefix="cli-assistant-${VERSION}/" \
            -o "${GITHUB_WORKSPACE}/rpmbuild/SOURCES/v${VERSION}.tar.gz" \
            HEAD
          rpmbuild \
            --define "_topdir ${GITHUB_WORKSPACE}/rpmbuild" \
            --define "_sourcedir ${GITHUB_WORKSPACE}/rpmbuild/SOURCES" \
            -bb packaging/cli-assistant.spec

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-assistant-rpm
          path: rpmbuild/RPMS/**/*.rpm

  release:
    name: Create Release
    needs: [build, rpm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.rpm
