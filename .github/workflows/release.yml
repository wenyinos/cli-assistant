name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rpm:
    name: RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Install git (required for checkout to keep .git)
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Install RPM build dependencies
        run: |
          dnf install -y \
            bzip2 \
            cargo \
            gcc \
            git \
            rpm-build \
            rust \
            selinux-policy-devel \
            systemd

      - name: Build RPM
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          mkdir -p "${GITHUB_WORKSPACE}/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          git archive \
            --format=tar.gz \
            --prefix="cli-assistant-${VERSION}/" \
            -o "${GITHUB_WORKSPACE}/rpmbuild/SOURCES/v${VERSION}.tar.gz" \
            HEAD
          rpmbuild \
            --define "_topdir ${GITHUB_WORKSPACE}/rpmbuild" \
            --define "_sourcedir ${GITHUB_WORKSPACE}/rpmbuild/SOURCES" \
            --define "dist %{nil}" \
            -bb packaging/cli-assistant.spec

      - name: Collect RPM artifacts
        run: |
          find rpmbuild/RPMS -type f \
            \( -name 'cli-assistant-[0-9]*.rpm' -o -name 'cli-assistant-selinux-*.rpm' \) \
            -exec cp -n {} . \;

      - uses: actions/upload-artifact@v4
        with:
          name: cli-assistant-rpm-${{ matrix.arch }}
          path: ./*.rpm

  deb:
    name: DEB (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts

      - name: Build the package
        run: |
          # Native package: builds in place, no orig tarball required.
          # -d skips the Build-Depends check: the Rust toolchain is provided by
          # dtolnay/rust-toolchain above, not by apt packages.
          dpkg-buildpackage -us -uc -b -d

      - name: Collect DEB artifacts
        run: |
          find .. -maxdepth 1 -name '*.deb' -exec cp -n {} . \;

      - uses: actions/upload-artifact@v4
        with:
          name: cli-assistant-deb-${{ matrix.arch }}
          path: ./*.deb

  pacman:
    name: Pacman (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          # Arch Linux's official repositories and container images are
          # x86_64-only; the PKGBUILD declares aarch64 as well, so Arch Linux
          # ARM users can build the same package locally with makepkg.
          - arch: x86_64
            runner: ubuntu-latest

    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm git sudo rust

      - uses: actions/checkout@v4

      - name: Build the package
        run: |
          # makepkg refuses to run as root, so build as an unprivileged user.
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          su builder -c 'cd "${GITHUB_WORKSPACE}/packaging" && makepkg -s --noconfirm'

      - name: Collect pacman artifacts
        run: |
          cp packaging/*.pkg.tar.* .

      - uses: actions/upload-artifact@v4
        with:
          name: cli-assistant-pacman-${{ matrix.arch }}
          path: ./*.pkg.tar.*

  release:
    name: Create Release
    needs: [rpm, deb, pacman]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          sha256sum *.rpm *.deb *.pkg.tar.zst > checksums.txt
          cat checksums.txt

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-body.md <<'EOF'
          ## 下载 / Downloads

          `c`（客户端）与 `clad`（守护进程）在同一个包中；安装后运行 `sudo c setup`
          交互完成配置（端点、API Key、模型、回复语言）。每个包可用 `checksums.txt`
          核对 SHA256。The client and daemon ship in one package; run `sudo c setup`
          after installing.

          **Linux**（Debian / Ubuntu 用 `.deb`，Fedora / RHEL 用 `.rpm`，Arch 用 `.pkg.tar.zst`）

          | 架构 / Arch | Debian / Ubuntu | Fedora / RHEL | Arch Linux |
          |---|---|---|---|
          | amd64 / x86-64 | [.deb](https://github.com/@REPO@/releases/download/@TAG@/cli-assistant_@VERSION@_amd64.deb) | [.rpm](https://github.com/@REPO@/releases/download/@TAG@/cli-assistant-@VERSION@-1.x86_64.rpm) | [.pkg.tar.zst](https://github.com/@REPO@/releases/download/@TAG@/cli-assistant-@VERSION@-1-x86_64.pkg.tar.zst) |
          | arm64 / aarch64 | [.deb](https://github.com/@REPO@/releases/download/@TAG@/cli-assistant_@VERSION@_arm64.deb) | [.rpm](https://github.com/@REPO@/releases/download/@TAG@/cli-assistant-@VERSION@-1.aarch64.rpm) | 本地 `makepkg` 构建 |

          Fedora / RHEL 另附 SELinux 策略子包 `cli-assistant-selinux`。Arch Linux ARM
          用户可用仓库中的 `packaging/PKGBUILD` 本地构建 aarch64 包。
          EOF
          sed -i "s|@REPO@|${GITHUB_REPOSITORY}|g; s|@TAG@|${GITHUB_REF_NAME}|g; s|@VERSION@|${VERSION}|g" release-body.md
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release-body.md
          files: |
            *.rpm
            *.deb
            *.pkg.tar.zst
            checksums.txt
